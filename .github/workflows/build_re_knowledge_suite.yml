name: Build RE Knowledge Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test and disassembly dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check standalone APK scanner without site packages
        run: python -I tools/granny_apk_recon.py --help
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build Android ARM64 and package suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find Android NDK and compile actual arm64-v8a shared library
        shell: bash
        run: |
          set -euo pipefail
          ndk=""
          for candidate in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK_LATEST_HOME:-}"; do
            if [[ -x "$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
              ndk="$candidate"
              break
            fi
          done
          for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            if [[ -n "$ndk" ]]; then break; fi
            if [[ -z "$sdk" || ! -d "$sdk/ndk" ]]; then continue; fi
            while IFS= read -r candidate; do
              if [[ -x "$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
                ndk="$candidate"
                break
              fi
            done < <(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -Vr)
          done
          if [[ -z "$ndk" ]]; then
            echo 'ERROR: Android NDK with aarch64-linux-android24-clang++ not found; refusing source-only CI artifact.' >&2
            exit 1
          fi
          echo "Using Android NDK: $ndk"
          cat "$ndk/source.properties"
          mkdir -p build/android_arm64
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            -std=c++17 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -nostdlib++ -Wl,--no-undefined -Wl,-z,max-page-size=16384 -Wl,-soname,liboffline_patch.so \
            templates/android_arm64_hook.cpp -o build/android_arm64/liboffline_patch.so
          readelf -h build/android_arm64/liboffline_patch.so
          readelf -d build/android_arm64/liboffline_patch.so
          python -c 'from pathlib import Path; from tools.package_suite import verify_android_elf; verify_android_elf(Path("build/android_arm64/liboffline_patch.so")); print("Verified ELF64 ET_DYN EM_AARCH64")'
      - name: Create and verify ZIP with compiled ARM64 library
        run: |
          python tools/package_suite.py --force --android-so build/android_arm64/liboffline_patch.so
          python -m zipfile -t 'Ultimate_Game_RE_&_Modding_Suite.zip'
          python -c 'import zipfile; from pathlib import Path; z=zipfile.ZipFile("Ultimate_Game_RE_&_Modding_Suite.zip"); assert z.read("build/android_arm64/liboffline_patch.so") == Path("build/android_arm64/liboffline_patch.so").read_bytes(); assert {"tools/granny_apk_recon.py", "docs/GRANNY_PS4_RECON_RU.md", "tests/test_granny_apk_recon.py"}.issubset(z.namelist())'
      - name: Upload downloadable suite
        uses: actions/upload-artifact@v4
        with:
          name: 'Ultimate_Game_RE_&_Modding_Suite'
          path: 'Ultimate_Game_RE_&_Modding_Suite.zip'
          if-no-files-found: error
          retention-days: 14

name: Build RE Knowledge Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test and disassembly dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Package suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create and verify ZIP
        run: |
          python tools/package_suite.py --force
          python -m zipfile -t 'Ultimate_Game_RE_&_Modding_Suite.zip'
      - name: Upload downloadable suite
        uses: actions/upload-artifact@v4
        with:
          name: 'Ultimate_Game_RE_&_Modding_Suite'
          path: 'Ultimate_Game_RE_&_Modding_Suite.zip'
          if-no-files-found: error
          retention-days: 14
